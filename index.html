<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CrustDefHub</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

  <link rel="stylesheet" href="style.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5SL8FQGGL8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-5SL8FQGGL8');
  </script>
</head>
</head>
<body>
  <!-- 地图容器 -->
  <div id="map"></div>
  
  <!-- 信息控制面板 -->
  <div class="info-box-bottom" id="info-box">
  	<button class="toggle-btn" onclick="togglePanel('info-box-content')" style="font-size: 12px;;">图层管理✅/❌</button>
  	<div id="info-box-content">
	    <label for="baseMapSelect">🗺️地理底图：</label>
	    <select id="baseMapSelect">
	      <option value="arcgis">地形图</option>
	    </select>
	
	    <label>🗺️GNSS速度场：</label>
	    <label><input type="checkbox" class="velocityCheckbox" id="toggleVelocity_0" value="./data/velocity1.json" checked> Hao et al., 2019, Sci. Rep.</label>
			<label><input type="checkbox" class="velocityCheckbox" id="toggleVelocity_1" value="./data/velocity2.json" > Wang & Shen, 2020, GJR</label>
			<label><input type="checkbox" id="toggleStationLabels" > 显示站点名称<label>
			<label for="zoomFactorInput">🔍 矢量缩放基准：</label>
	    <input type="range" id="zoomFactorInput" min="5" max="15" value="9" />
	    <span id="zoomFactorDisplay" style="display: none;">9</span>
	    <label><input type="checkbox" id="toggleFaults" checked /> 活动断裂 (Wu et al., 2024)</label>
	    <label><input type="checkbox" id="toggleEarthquake"  /> 历史地震分布</label>
	    <label>最小震级: <input type="number" id="minMagnitude" value="5" step="0.5" min="0.5" max="8.5" /></label>
	    <label>🖍 块体边界活动速率(红正蓝负)：</label>
	    <label><input type="checkbox" id="toggleImportedSSLines" /> 走滑速率</label>
	    <label><input type="checkbox" id="toggleImportedDSLines" /> 汇聚速率</label>
	
	    <label>🖍 GNSS应变率场：</label>
	    <label><input type="checkbox" id="toggleImportedDaliDrawn" /> 面膨胀率</label>
	    <label>最大面膨胀率: <input type="number" id="maxStrainInput" value="4.6" step="0.1" min="0.1" max="100" /></label>
  	</div>
  	
	</div>
	<div id="export-panel">
	  <button class="toggle-btn" onclick="togglePanel('export-panel-content')" style="font-size: 12px;;">速度剖面交互面板✅/❌</button>
	  <div id="export-panel-content">
	    <div id="info-text">📌 绘制剖面范围和断层位置</div>
	    <button id="projectBtn" disabled>📥绘制剖面并导出</button>
	    <div id="info-text">📌 框选导出多边形内速度矢量</div>
	    <button id="exportPolyBtn" disabled>📤 导出多边形内GPS数据</button>
	  </div>
	</div>

	<div id="contact-info">
	  <button class="toggle-btn" onclick="togglePanel('contact-info-content')" style="font-size: 12px;;">联系信息✅/❌</button>
	  <div id="contact-info-content">
	    <label>🏢 中国地震局第二监测中心</label>
	    <label>👥 大地测量数据团队</label>
	    <label>👨‍💻 宋尚武</label>
	    <label>✉️ shangw.song@hotmail.com</label>
	    <label>💬 微信二维码</label>
	    <img src="wechat_qr_code.jpg" alt="WeChat QR Code" width="180" height="180">
	  </div>
	</div>
	<style>
	  #plot-container-content {
	    display: none;
	  }
	</style>
	<div class="plot-container" id="plot-container">
	  <button class="toggle-btn" onclick="togglePanel('plot-container-content')" style="font-size: 12px;;">查看剖面结果✅/❌</button>
	  <div id="plot-container-content">
	    <div id="parallelPlot" style="width: 600px; height: 300px;"></div>
			<div id="verticalPlot" style="width: 600px; height: 300px;"></div>
	  </div>
	</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="mainobf.js"></script>

</body>



</html>
