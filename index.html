<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2239">
  <title>CrustDefHub</title>
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="lib/leaflet/leaflet.draw.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="地壳形变交互地图"></div>
  <header class="app-brand">
    <span class="brand-mark">CD</span>
    <div><strong>CrustDefHub</strong><small>地壳形变</small></div>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5SL8FQGGL8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-5SL8FQGGL8');
    </script>
  </header>
	
  <aside class="map-panel layer-panel">
    <div class="panel-heading">
      <div><span class="eyebrow">DATA LAYERS</span><h1>图层管理</h1></div>
      <button class="panel-toggle" type="button" onclick="togglePanel('info-box-content')" aria-label="展开或收起图层管理">⌃</button>
    </div>
    <div id="info-box-content" class="panel-content">
      <section>
        <h2>底图</h2>
        <label class="field-label" for="baseMapSelect">地图样式</label>
        <select id="baseMapSelect"><option value="arcgis">地形晕渲图</option><option value="osm">行政道路图</option></select>
      </section>
      <section>
        <h2>GNSS 速度场</h2>
        <label class="control-row"><input type="checkbox" class="velocityCheckbox" id="toggleVelocity_0" value="./data/velocity1.json" checked><span>Hao et al., 2019, Sci. Rep.</span></label>
        <label class="control-row"><input type="checkbox" class="velocityCheckbox" id="toggleVelocity_1" value="./data/velocity2.json"><span>Wang &amp; Shen, 2020, GJR</span></label>
        <label class="control-row"><input type="checkbox" class="velocityCheckbox" id="toggleVelocity_2" value="./data/velocity3.json"><span>融合速度场</span></label>
         <label class="control-row"><input type="checkbox" class="velocityCheckbox" id="toggleVelocity_3" value="./data/velocity4.json"><span>欧亚速度场(Elliott et al., 2026)</span></label>
        <label class="control-row"><input type="checkbox" id="toggleStationLabels"><span>显示站点名称</span></label>
        <label class="field-label" for="zoomFactorInput">矢量缩放</label>
        <input type="range" id="zoomFactorInput" min="5" max="15" value="9">
        <span id="zoomFactorDisplay" class="range-value">9</span>
      </section>
      <section>
        <h2>构造与地震</h2>
        <label class="control-row"><input type="checkbox" id="toggleFaults" checked><span>活动断裂（Wu et al., 2024）</span></label>
        <label class="control-row"><input type="checkbox" id="toggleAFEAD"><span>活动断裂（AFEAD v2022）</span></label>
        <label class="control-row"><input type="checkbox" id="toggleEarthquake"><span>历史地震分布</span></label>
        <label class="field-label compact" for="minMagnitude">最小震级</label>
        <input type="number" id="minMagnitude" value="5" step="0.5" min="0.5" max="8.5">
        <label class="control-row beachball-row"><input type="checkbox" id="toggleBeachball"><span>震源机制解（ISC &amp; GCMT）</span></label>
        <p id="beachballStatus" class="layer-status" aria-live="polite">未显示</p>
      </section>
      <section>
        <h2>形变速率</h2>
        <label class="control-row"><input type="checkbox" id="toggleImportedSSLines"><span>走滑速率</span></label>
        <label class="control-row"><input type="checkbox" id="toggleImportedDSLines"><span>汇聚 / 拉张速率</span></label>
        <label class="control-row"><input type="checkbox" id="toggleImportedDaliDrawn"><span>面膨胀率</span></label>
        <label class="field-label compact" for="maxStrainInput">最大面膨胀率</label>
        <input type="number" id="maxStrainInput" value="4.6" step="0.1" min="0.1" max="100">
      </section>
    </div>
  </aside>

  <section id="export-panel" class="map-panel tool-panel">
    <div class="panel-heading"><div><span class="eyebrow">ANALYSIS</span><h2>剖面与导出</h2></div><button class="panel-toggle" type="button" onclick="togglePanel('export-panel-content')">⌃</button></div>
    <div id="export-panel-content" class="panel-content">
      <p>在地图上绘制剖面线或多边形后，可生成分析结果与导出数据。</p>
      <div class="button-stack"><button id="projectBtn" disabled>绘制并导出剖面</button><button id="exportPolyBtn" disabled>导出多边形内 GNSS 数据</button></div>
    </div>
  </section>

  <section id="contact-info" class="map-panel contact-panel">
    <div class="panel-heading"><div><span class="eyebrow">ABOUT</span><h2>数据团队</h2></div><button class="panel-toggle" type="button" onclick="togglePanel('contact-info-content')">⌃</button></div>
    <div id="contact-info-content" class="panel-content"><p>中国地震局第二监测中心<br>大地测量数据团队<br><a href="mailto:shangw.song@hotmail.com">shangw.song@hotmail.com</a></p></div>
  </section>

  <section class="plot-container map-panel" id="plot-container">
    <div class="panel-heading"><div><span class="eyebrow">RESULTS</span><h2>剖面结果</h2></div><button class="panel-toggle" type="button" onclick="togglePanel('plot-container-content')">⌃</button></div>
    <div id="plot-container-content" class="panel-content" style="display:none"><div id="parallelPlot"></div><div id="verticalPlot"></div></div>
  </section>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="lib/plotly/plotly.min.js"></script>
  <script src="lib/leaflet/leaflet.draw.js"></script>
  <script src="mainobf.js"></script>
  <script src="beachball-performance.js"></script>
</body>
</html>
